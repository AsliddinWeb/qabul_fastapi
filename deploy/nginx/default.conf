upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

upstream landing_upstream {
    server landing:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----- API -----
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ----- Uploaded media -----
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # ----- Vue SPA (mounted at /app) -----
    # Trailing slash on proxy_pass strips the /app/ prefix before forwarding.
    # Vite was built with base: '/app/' so asset URLs already have it.
    location /app/ {
        proxy_pass         http://frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ----- International admissions public landing -----
    # Single-file static page served by this nginx container; the form
    # POSTs to /api/v1/international-admissions/apply (handled above).
    # File lives at /usr/share/nginx/html/intl/index.html via the
    # docker-compose bind mount.
    location /intl/ {
        alias /usr/share/nginx/html/intl/;
        index index.html;
        try_files $uri $uri/ /intl/index.html;
        # Don't cache the HTML — staff edit copy frequently.
        add_header Cache-Control "no-store";
    }

    # ----- Nuxt landing (root) -----
    location / {
        proxy_pass         http://landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
