# Dev overrides: hot reload + source mounts.
# Run with:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ./backend:/app
      - backend_media:/app/media

  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  landing:
    build:
      target: dev
    command: ["npm", "run", "dev"]
    volumes:
      - ./landing:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"
